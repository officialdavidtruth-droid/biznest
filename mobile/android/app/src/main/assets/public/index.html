<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BizNest — Offline</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#0f6410;color:#fff;
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px}
  .card{max-width:340px}
  .logo{width:84px;height:84px;border-radius:22px;margin:0 auto 24px;display:block}
  h1{font-size:22px;margin:0 0 10px}
  p{margin:0 0 28px;line-height:1.5;opacity:.9;font-size:15px}
  button{background:#fff;color:#0f6410;border:0;border-radius:999px;padding:14px 34px;font-size:16px;font-weight:600}
  button:active{opacity:.85}
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="icon.png" alt="BizNest">
    <h1>You're offline</h1>
    <p>BizNest needs an internet connection to load your store, orders and customers. Check your data or Wi-Fi and try again.</p>
    <button id="retry">Try again</button>
  </div>
<script>
  document.getElementById('retry').addEventListener('click', function () {
    window.location.href = 'https://biznest.space/';
  });
  window.addEventListener('online', function () { window.location.href = 'https://biznest.space/'; });
</script>
</body>
</html>
