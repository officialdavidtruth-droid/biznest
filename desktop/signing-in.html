<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>BizNest — signing in</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7f4;font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif;color:#142014}
.card{max-width:440px;margin:24px;background:#fff;border:1px solid #dfe7df;border-radius:20px;padding:32px;text-align:center;box-shadow:0 10px 40px rgba(15,100,16,.08)}
h1{font-size:22px;margin:0 0 8px}p{margin:0 0 20px;color:#4b5b4b}
a{display:block;padding:13px 18px;border-radius:999px;font:600 15px system-ui;text-decoration:none;background:#fff;color:#0f6410;border:2px solid #0f6410}
</style></head><body><div class="card">
<h1>Finish signing in with Google</h1>
<p>Your browser just opened. Sign in there with Google, then come back to this window. It continues by itself.</p>
<a id="back" href="#">Cancel</a>
</div><script>
var b=new URLSearchParams(location.search).get("back")||"https://biznest.space/";
document.getElementById("back").onclick=function(e){e.preventDefault();location.href=b};
</script></body></html>
