<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>BizNest — offline</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7f4;font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif;color:#142014}
.card{max-width:440px;margin:24px;background:#fff;border:1px solid #dfe7df;border-radius:20px;padding:32px;text-align:center;box-shadow:0 10px 40px rgba(15,100,16,.08)}
h1{font-size:22px;margin:0 0 8px}p{margin:0 0 20px;color:#4b5b4b}
a,button{display:block;width:100%;padding:13px 18px;border-radius:999px;font:600 15px system-ui;text-decoration:none;cursor:pointer;margin-top:10px}
.primary{background:#0f6410;color:#fff;border:0}.ghost{background:#fff;color:#0f6410;border:2px solid #0f6410}
</style></head><body><div class="card">
<h1>You're offline</h1>
<p>BizNest can't reach the internet right now. You can keep selling with the offline register. Sales are saved on this computer and recorded automatically when you're back online.</p>
<a class="ghost" href="offline-pos.html">Open offline register</a>
<button class="primary" id="retry">Try again</button>
</div>
<script>
var q=new URLSearchParams(location.search).get("retry")||"https://biznest.space/";
document.getElementById("retry").onclick=function(){location.href=q};
window.addEventListener("online",function(){location.href=q});
</script></body></html>
