name: Generate Android signing key (run once)

# Creates the release signing key ONCE. Download the ENCRYPTED file from the run's Artifacts,
# decrypt it with the password you entered (command is in the step below),
# then add 4 repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   (contents of keystore.base64.txt)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS         (biznest)
#   ANDROID_KEY_PASSWORD      (same as the keystore password)
# Keep a safe copy of the keystore: if it's lost you can never update the app
# on the Play Store or over existing installs.

on:
  workflow_dispatch:
    inputs:
      password:
        description: "Password for the new key (min 8 chars)"
        required: true

jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Generate keystore
        env:
          PW: ${{ inputs.password }}
        run: |
          echo "::add-mask::$PW"
          keytool -genkeypair -v -keystore biznest-release.keystore -alias biznest \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=BizNest, O=BizNest, C=NG"
          base64 -w0 biznest-release.keystore > keystore.base64.txt
          # Never publish the key in the clear: the artifact is encrypted with the password you typed.
          # Decrypt locally:  openssl enc -d -aes-256-cbc -pbkdf2 -in android-signing-key.enc -out android-signing-key.tar.gz
          tar czf android-signing-key.tar.gz biznest-release.keystore keystore.base64.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:PW -in android-signing-key.tar.gz -out android-signing-key.enc
          rm -f biznest-release.keystore keystore.base64.txt android-signing-key.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-key
          path: android-signing-key.enc
          retention-days: 1
